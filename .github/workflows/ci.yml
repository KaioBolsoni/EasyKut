name: EasyKut CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js (Frontend syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check core database schemas services server.py tests

      - name: SAST security scan with Bandit
        run: bandit -c pyproject.toml -r core database schemas services server.py -ll

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Frontend JS ES Module syntax check
        run: |
          for f in web/js/*.js web/app.js; do node --check "$f"; done

      - name: Run isolated pytest suite
        run: pytest
